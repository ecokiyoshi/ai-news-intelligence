name: Run production pipeline once

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  run-once:
    name: Run one production pipeline cycle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DEPLOY_DIR: /opt/ai-news-intelligence

    steps:
      - name: Configure verified SSH connection
        shell: bash
        run: |
          set -Eeuo pipefail
          required=(VPS_HOST VPS_USER VPS_PORT VPS_SSH_KEY VPS_KNOWN_HOSTS)
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required production secret is missing: ${variable}"
              exit 1
            fi
          done
          [[ "${VPS_HOST}" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$ ]]
          [[ "${VPS_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${VPS_USER}" != "root" ]]
          [[ "${VPS_PORT}" =~ ^[0-9]{1,5}$ ]]
          ((10#${VPS_PORT} >= 1 && 10#${VPS_PORT} <= 65535))

          umask 077
          install -d "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_KEY}" >"${HOME}/.ssh/run_once_key"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"

      - name: Stop scheduler, run once, restart, and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -i "${HOME}/.ssh/run_once_key"
            -p "${VPS_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          target="${VPS_USER}@${VPS_HOST}"
          ssh "${ssh_options[@]}" "${target}" bash -se -- "${DEPLOY_DIR}" <<'REMOTE'
          set -Eeuo pipefail
          deploy_dir="$1"
          cd "${deploy_dir}"
          exec 9>"${deploy_dir}/.operations.lock"
          flock --nonblock 9 || {
            echo 'Another deploy, backup, restore, or manual run is already active.' >&2
            exit 1
          }
          compose=(docker compose --env-file .env -f compose.production.yaml)
          restart_scheduler() {
            "${compose[@]}" up -d --no-build scheduler
          }
          trap restart_scheduler EXIT
          "${compose[@]}" stop --timeout 60 scheduler
          "${compose[@]}" run --rm --no-deps scheduler python -m app.runtime run-once
          restart_scheduler
          trap - EXIT
          ./scripts/healthcheck.sh
          REMOTE

      - name: Remove SSH private key
        if: always()
        shell: bash
        run: rm -f -- "${HOME}/.ssh/run_once_key"
