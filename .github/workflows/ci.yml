name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      PIPELINE_MODE: news
      SCHEDULER_PROVIDER: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest

      - name: Build application image
        run: docker build --tag ai-news-intelligence:ci .

      - name: Validate local Compose configuration
        run: docker compose --env-file /dev/null config --quiet

      - name: Validate production Compose configuration
        run: docker compose --env-file /dev/null -f compose.production.yaml config --quiet
